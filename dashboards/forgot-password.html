<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=Edge">
     <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
     <title>Forgot Password - 2tors.ng</title>
     <link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="../css/learnroom-tokens.css">
     <link rel="stylesheet" href="../css/font-awesome.min.css">
     <link rel="stylesheet" href="../css/style.css">
     <style>
          body { background: #f9f9f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding-top: 0; }
          .auth-wrap { width: 100%; max-width: 420px; margin: 0 auto; padding: 20px; }
          .auth-box { background: #fff; padding: 40px; border-radius: 5px; box-shadow: 0 1px 30px rgba(0,0,0,0.08); border-top: 5px solid #29ca8e; }
          .auth-box h2 { margin: 0 0 5px; font-size: 24px; }
          .auth-box p { color: #909090; margin-bottom: 25px; }
          .auth-box .form-control { border-radius: 5px; box-shadow: none; height: 48px; border: 1px solid #f0f0f0; margin-bottom: 15px; }
          .auth-box .form-control:focus { border-color: #29ca8e; }
          .auth-box .submit-btn { background: #29ca8e; border: 1px solid #29ca8e; color: #fff; border-radius: 50px; padding: 12px 30px; font-size: 14px; font-weight: bold; width: 100%; text-transform: uppercase; letter-spacing: 1px; }
          .auth-box .submit-btn:hover { background: #1a237e; border-color: #1a237e; color: #fff; }
          .auth-box a { color: #29ca8e; font-weight: 600; }
          .auth-box a:hover { color: #1a237e; }
          .auth-box .text-muted { color: #909090; font-size: 13px; }
          .auth-logo { text-align: center; margin-bottom: 10px; }
          .auth-logo a { font-size: 22px; font-weight: bold; color: #29ca8e; font-family: 'Muli', sans-serif; }
          .success-icon { font-size: 64px; color: #29ca8e; margin-bottom: 20px; display: block; }
     </style>
</head>
<body>
     <div class="auth-wrap">
          <div class="auth-box">
               <div class="auth-logo">
                    <a href="../index.html">2tors.ng</a>
               </div>
               <div id="step-email">
                    <h2>Forgot Password?</h2>
                    <p>Enter your email and we'll send you a reset link.</p>
                    <form id="forgotForm" onsubmit="event.preventDefault(); document.getElementById('step-email').style.display='none'; document.getElementById('step-success').style.display='block';">
                         <div class="form-group">
                              <input type="email" class="form-control" placeholder="Email Address" required>
                         </div>
                         <button type="submit" class="submit-btn form-control">Send Reset Link</button>
                    </form>
                    <div class="text-center" style="margin-top: 20px;">
                         <p class="text-muted"><a href="login.html"><i class="fa fa-arrow-left"></i> Back to Sign In</a></p>
                    </div>
               </div>
               <div id="step-success" style="display: none;">
                    <div class="text-center">
                         <i class="fa fa-check-circle success-icon"></i>
                         <h2>Check Your Email</h2>
                         <p>We've sent a password reset link to your email. Please check your inbox and follow the instructions.</p>
                         <a href="login.html" class="submit-btn form-control" style="text-decoration: none; display: block; text-align: center; margin-top: 20px;">Back to Sign In</a>
                    </div>
               </div>
          </div>
          <div class="text-center" style="margin-top: 20px;">
               <p style="color: #909090; font-size: 13px;">&copy; 2026 2tors.ng. All rights reserved.</p>
          </div>
     </div>
     <script src="../js/jquery.js"></script>
     <script src="../js/bootstrap.min.js"></script>
</body>
</html>
