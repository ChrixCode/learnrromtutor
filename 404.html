<!DOCTYPE html>
<html lang="en">
<head>
     <title>Page Not Found — 2tors.ng</title>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
     <link rel="stylesheet" href="css/bootstrap.min.css">
     <link rel="stylesheet" href="css/font-awesome.min.css">
     <link rel="stylesheet" href="css/learnroom-tokens.css">
     <style>
          body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--tt-bg);font-family:var(--tt-font-body);overflow:hidden;}
          .err-wrap{text-align:center;max-width:480px;padding:40px 24px;position:relative;z-index:2;}
          .err-code{font-family:var(--tt-font-head);font-size:120px;font-weight:900;line-height:1;color:var(--tt-teal);margin-bottom:0;position:relative;}
          .err-code::after{content:'';position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:80%;height:6px;background:linear-gradient(90deg,var(--tt-teal),var(--tt-orange));border-radius:3px;}
          .err-title{font-family:var(--tt-font-head);font-size:28px;font-weight:900;color:var(--tt-text);margin:20px 0 12px;}
          .err-msg{color:var(--tt-muted);font-size:15px;margin-bottom:32px;}
          .err-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
          /* Background blobs */
          .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.12;z-index:0;}
          .blob1{width:400px;height:400px;background:var(--tt-teal);top:-100px;left:-100px;}
          .blob2{width:350px;height:350px;background:var(--tt-orange);bottom:-80px;right:-80px;}
          .blob3{width:250px;height:250px;background:var(--tt-magenta);bottom:100px;left:50px;}
     </style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="err-wrap">
     <div class="err-code">404</div>
     <h2 class="err-title">Page Not Found</h2>
     <p class="err-msg">We couldn't find the page you were looking for. It may have been moved, deleted or the URL may be incorrect.</p>
     <div class="err-actions">
          <a href="index.html" class="tt-btn tt-btn-primary"><i class="fa fa-home"></i> Go to Home</a>
          <a href="browse-tutors.html" class="tt-btn tt-btn-secondary"><i class="fa fa-search"></i> Browse Tutors</a>
     </div>
     <p style="margin-top:28px;font-size:13px;color:var(--tt-faint);">If you need help, <a href="contact.html" style="color:var(--tt-teal);font-weight:700;">contact our support team</a>.</p>
     <div style="margin-top:32px;">
          <a href="index.html" style="font-family:var(--tt-font-head);font-size:20px;font-weight:900;color:var(--tt-teal);text-decoration:none;">2tors<span style="color:var(--tt-orange)">.</span>ng</a>
     </div>
</div>
</body>
</html>
